name: iOS build (manual)

# macOS runners cost 10x Linux minutes, so this runs only on demand
# or for release tags.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

env:
  FLUTTER_VERSION: "3.47.9"

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install pillow==11.0.0
          python tool/generate_assets.py
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: |
          flutter create --platforms=android,ios,web --org com.gamestudio100 --project-name game_100_hexa_sort .
          python tool/patch_platforms.py
          flutter pub get
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create
      - name: Build iOS (unsigned)
        run: flutter build ios --release --no-codesign
      - name: Package Runner.app
        run: cd build/ios/iphoneos && zip -qr ../../../Runner-unsigned.zip Runner.app
      - uses: actions/upload-artifact@v4
        with:
          name: game-100-hexa-sort-ios-unsigned
          path: Runner-unsigned.zip
          retention-days: 14
