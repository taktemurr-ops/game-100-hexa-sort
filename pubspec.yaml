name: game_100_hexa_sort
description: "Hexa Sort - Game Studio 100. Offline-first Flutter game for Android, iOS and Web."
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Ortak çekirdek: https://github.com/taktemurr-ops/studio-core
  studio_core:
    git:
      url: https://github.com/taktemurr-ops/studio-core
      ref: 782e05b0d67b349f0af0cfe9e39b2e2a81228d20
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  shared_preferences: ^2.3.2
  audioplayers: ^6.5.0
  google_mobile_ads: ^9.2.0
  in_app_purchase: ^3.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/sfx/
    - assets/config/
    - assets/branding/

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/branding/icon.png
  adaptive_icon_background: "#22223B"
  adaptive_icon_foreground: assets/branding/icon_foreground.png
  web:
    generate: true
    image_path: assets/branding/icon.png
    background_color: "#22223B"
    theme_color: "#22223B"

flutter_native_splash:
  color: "#22223B"
  image: assets/branding/splash.png
  android_12:
    color: "#22223B"
    image: assets/branding/splash_android12.png
  web: true
